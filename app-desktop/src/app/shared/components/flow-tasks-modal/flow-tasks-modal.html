<div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <!-- Cabeçalho -->
  <header class="modal-header">
    <h2 id="modal-title" class="modal-title">Selecionar tarefas opcionais</h2>
    <p class="modal-subtitle">Selecione as tarefas que deseja executar no fluxo</p>
  </header>

  <!-- Corpo -->
  <div class="modal-body">
    <div class="tasks-actions">
      <button type="button" class="link-btn" (click)="toggleAll()">
        {{ allSelected ? 'Limpar' : 'Selecionar todos' }}
      </button>
    </div>

    <ul class="tasks-list">
      <li *ngFor="let task of tasks" class="task-item">
        <label class="task-label" [for]="task.id">
          <input type="checkbox" [id]="task.id" [(ngModel)]="task.checked" />
          <span class="task-text">{{ task.label }}</span>
        </label>
      </li>
    </ul>
  </div>

  <!-- Rodapé -->
  <footer class="modal-footer">
    <span class="selected-info" *ngIf="selectedCount > 0">
      {{ selectedCount }} tarefa(s) selecionada(s)
    </span>
    <div class="footer-buttons">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancelar</button>
      <button type="button" class="btn btn-primary" (click)="onConfirm()">Confirmar</button>
    </div>
  </footer>
</div>
